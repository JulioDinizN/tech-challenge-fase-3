name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/oci
          - infra/environments/homolog/core
          - infra/environments/homolog/platform
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize without remote backend
        run: terraform -chdir="${{ matrix.directory }}" init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir="${{ matrix.directory }}" validate

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan Terraform configuration
        continue-on-error: ${{ vars.SECURITY_GATE_ENABLED != 'true' }}
        run: trivy config --severity CRITICAL --exit-code 1 "${{ matrix.directory }}"
