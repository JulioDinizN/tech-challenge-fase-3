name: Publish scanned service image
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      ocir_registry:
        required: true
        type: string
      ocir_namespace:
        required: true
        type: string
      ocir_repository_prefix:
        required: true
        type: string
    secrets:
      OCIR_USERNAME:
        required: true
      OCIR_AUTH_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_OCIR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: scanned-${{ inputs.service_name }}
          path: /tmp/scanned
      - name: Load the exact image that passed all gates
        run: docker load -i /tmp/scanned/scanned-image.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ inputs.ocir_registry }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}
      - name: Push and describe immutable image
        env:
          REGISTRY: ${{ inputs.ocir_registry }}
          NAMESPACE: ${{ inputs.ocir_namespace }}
          PREFIX: ${{ inputs.ocir_repository_prefix }}
          SERVICE: ${{ inputs.service_name }}
        run: |
          test -n "$REGISTRY" && test -n "$NAMESPACE" && test -n "$PREFIX"
          image="$REGISTRY/$NAMESPACE/$PREFIX/$SERVICE"
          tag="sha-${GITHUB_SHA:0:12}"
          docker tag "$SERVICE:ci-$GITHUB_SHA" "$image:$tag"
          docker push "$image:$tag"
          python3 scripts/ci/write_promotion.py --service "$SERVICE" --image "$image" --tag "$tag" --output "promotion-$SERVICE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: promotion-${{ inputs.service_name }}
          path: promotion-${{ inputs.service_name }}.json
          retention-days: 1
          if-no-files-found: error
