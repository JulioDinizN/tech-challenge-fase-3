name: Reusable service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      language:
        required: true
        type: string
      runtime_version:
        required: true
        type: string
      security_gate_enabled:
        default: false
        type: boolean
      publish:
        default: false
        type: boolean
      ocir_registry:
        default: ""
        type: string
      ocir_namespace:
        default: ""
        type: string
      ocir_repository_prefix:
        default: ""
        type: string
    secrets:
      OCIR_USERNAME:
        required: false
      OCIR_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build-test-scan:
    name: ${{ inputs.service_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: ${{ inputs.service_name }}:ci-${{ github.sha }}
      SECURITY_EXIT_CODE: ${{ inputs.security_gate_enabled && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.runtime_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Test Go service
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go test ./...

      - name: Vet Go service
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go vet ./...

      - name: Install Go analysis tools
        if: inputs.language == 'go'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Lint Go service
        if: inputs.language == 'go'
        continue-on-error: ${{ !inputs.security_gate_enabled }}
        working-directory: ${{ inputs.service_path }}
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Run Go SAST
        if: inputs.language == 'go'
        continue-on-error: ${{ !inputs.security_gate_enabled }}
        working-directory: ${{ inputs.service_path }}
        run: |
          "$(go env GOPATH)/bin/gosec" -severity high -confidence medium ./...

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.runtime_version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.service_path }}/requirements.txt
            .ci/python-tools.txt

      - name: Install Python dependencies
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ inputs.service_path }}/requirements.txt"
          python -m pip install -r .ci/python-tools.txt

      - name: Test Python service
        if: inputs.language == 'python'
        run: python -m pytest -q "${{ inputs.service_path }}"

      - name: Lint Python service
        if: inputs.language == 'python'
        continue-on-error: ${{ !inputs.security_gate_enabled }}
        run: ruff check "${{ inputs.service_path }}"

      - name: Run Python SAST
        if: inputs.language == 'python'
        continue-on-error: ${{ !inputs.security_gate_enabled }}
        run: bandit -q -r "${{ inputs.service_path }}"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan source dependencies and secrets
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity CRITICAL \
            --exit-code "$SECURITY_EXIT_CODE" \
            "${{ inputs.service_path }}"

      - name: Build container image
        run: docker build --tag "$LOCAL_IMAGE" "${{ inputs.service_path }}"

      - name: Scan container image
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code "$SECURITY_EXIT_CODE" \
            "$LOCAL_IMAGE"

      - name: Validate publication configuration
        if: inputs.publish
        env:
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
        run: |
          test -n "${{ inputs.ocir_registry }}"
          test -n "${{ inputs.ocir_namespace }}"
          test -n "${{ inputs.ocir_repository_prefix }}"
          test -n "$OCIR_USERNAME"
          test -n "$OCIR_AUTH_TOKEN"

      - name: Log in to OCIR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.ocir_registry }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Push immutable image
        if: inputs.publish
        id: publish
        env:
          REGISTRY: ${{ inputs.ocir_registry }}
          NAMESPACE: ${{ inputs.ocir_namespace }}
          PREFIX: ${{ inputs.ocir_repository_prefix }}
          SERVICE: ${{ inputs.service_name }}
        run: |
          image="$REGISTRY/$NAMESPACE/$PREFIX/$SERVICE"
          tag="sha-${GITHUB_SHA:0:12}"
          docker tag "$LOCAL_IMAGE" "$image:$tag"
          docker push "$image:$tag"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create promotion descriptor
        if: inputs.publish
        run: |
          python3 scripts/ci/write_promotion.py \
            --service "${{ inputs.service_name }}" \
            --image "${{ steps.publish.outputs.image }}" \
            --tag "${{ steps.publish.outputs.tag }}" \
            --output "promotion-${{ inputs.service_name }}.json"

      - name: Upload promotion descriptor
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-${{ inputs.service_name }}
          path: promotion-${{ inputs.service_name }}.json
          if-no-files-found: error
          retention-days: 1
