name: Reusable service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      language:
        required: true
        type: string
      runtime_version:
        required: true
        type: string
      export_image:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: ${{ inputs.service_name }}:ci-${{ github.sha }}
      SECURITY_EXIT_CODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.runtime_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.runtime_version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.service_path }}/requirements.txt
            .ci/python-tools.txt

      - name: Install Python dependencies
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ inputs.service_path }}/requirements.txt"
          python -m pip install -r .ci/python-tools.txt

      - name: Test Go service
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go test ./...

      - name: Test Python service
        if: inputs.language == 'python'
        run: python -m pytest -q "${{ inputs.service_path }}"

  lint:
    name: Lint and static analysis
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: ${{ inputs.service_name }}:ci-${{ github.sha }}
      SECURITY_EXIT_CODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.runtime_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.runtime_version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.service_path }}/requirements.txt
            .ci/python-tools.txt

      - name: Install Python dependencies
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ inputs.service_path }}/requirements.txt"
          python -m pip install -r .ci/python-tools.txt

      - name: Vet Go service
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: go vet ./...

      - name: Install Go linter
        if: inputs.language == 'go'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint Go service
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Lint Python service
        if: inputs.language == 'python'
        run: ruff check "${{ inputs.service_path }}"

  security:
    name: SAST and SCA
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: ${{ inputs.service_name }}:ci-${{ github.sha }}
      SECURITY_EXIT_CODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.runtime_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.runtime_version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.service_path }}/requirements.txt
            .ci/python-tools.txt

      - name: Install Python dependencies
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ inputs.service_path }}/requirements.txt"
          python -m pip install -r .ci/python-tools.txt

      - name: Install Go SAST
        if: inputs.language == 'go'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run Go SAST
        if: inputs.language == 'go'
        working-directory: ${{ inputs.service_path }}
        run: |
          "$(go env GOPATH)/bin/gosec" -severity high -confidence medium ./...

      - name: Run Python SAST
        if: inputs.language == 'python'
        run: bandit -q -r "${{ inputs.service_path }}"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan source dependencies and secrets
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity CRITICAL \
            --exit-code "$SECURITY_EXIT_CODE" \
            "${{ inputs.service_path }}"

  container:
    name: Build and scan container
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: ${{ inputs.service_name }}:ci-${{ github.sha }}
      SECURITY_EXIT_CODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Build container image
        run: docker build --tag "$LOCAL_IMAGE" "${{ inputs.service_path }}"

      - name: Scan container image
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code "$SECURITY_EXIT_CODE" \
            "$LOCAL_IMAGE"

      - name: Save scanned image
        if: inputs.export_image
        run: docker save "$LOCAL_IMAGE" -o /tmp/scanned-image.tar

      - name: Upload scanned image
        if: inputs.export_image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanned-${{ inputs.service_name }}
          path: /tmp/scanned-image.tar
          retention-days: 1
          if-no-files-found: error
